[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contribtool"
version = "0.1.0"
description = "Safe, reproducible Git contribution schedule generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13"]

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=8"]

[project.scripts]
contribtool = "contribtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
